[project]
name = "easybiz"
version = "0.1.0"
description = "Multi-tenant modular ERP core"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-tenants>=3.8",
    "django-ninja>=1.7",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "django-cors-headers>=4.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ['/migrations/']

[tool.django-stubs]
django_settings_module = "config.settings"
